# Fly.io deployment for the p2a-mcp backend (hosted bring-your-own-key demo).
#
# This deploys the PREBUILT image from GHCR — it does not build from source.
# Pair with the GitHub Pages frontend (see ../.github/workflows/web-deploy.yml)
# and docs/guides/DEPLOYMENT.md.
#
# Deploy:   fly deploy -c deploy/fly.toml
# Cert:     fly certs add p2a-api.qamelab.org -a p2a-qamelab-backend
#
# Prereqs:
#   * The GHCR package ghcr.io/umatter/prompt2analytics/backend must be PUBLIC.
#   * NEVER set OPENAI_API_KEY / ANTHROPIC_API_KEY / OPENROUTER_API_KEY here —
#     a shared key on this unauthenticated endpoint turns it into an open proxy
#     billed to you. Unset = true BYOK.

app = "p2a-qamelab-backend"
primary_region = "fra"          # Frankfurt — EU

[build]
  # Pin an explicit version tag (not the mutable :latest) for reproducible
  # deploys. Bump deliberately when shipping a new backend release.
  image = "ghcr.io/umatter/prompt2analytics/backend:0.1.3"

[env]
  P2A_HOST = "0.0.0.0"
  P2A_PORT = "8080"
  P2A_CORS_ORIGINS = "https://p2a.qamelab.org"
  P2A_MAX_HTTP_BODY_MB = "32"

  # Outbound counterpart to P2A_CORS_ORIGINS above. Callers supply their own
  # provider base_url, so without this the LLM routes will POST a caller-chosen
  # body to any https host and relay the response back — an SSRF and open relay
  # through this app's egress IP. Bare hostnames, matched exactly against the
  # URL host (case-insensitive); a scheme or path here would never match.
  # Also revokes the Ollama loopback exemption, which is what a remote caller
  # would otherwise use to read this machine's own ports. Ollama is unreachable
  # from a hosted backend anyway; desktop and self-host builds leave this unset.
  P2A_LLM_ALLOWED_HOSTS = "api.openai.com,api.anthropic.com,openrouter.ai"

  # Open-but-hardened bring-your-own-key demo: no login. Per-visitor isolation
  # relies on unguessable, non-enumerable session IDs; the code hardening
  # (base_url SSRF allowlist, SQL file-read guard, parser bounds) closes the
  # server-exploitation vectors, and this flag drops the session-list and
  # file-browser enumeration endpoints. Abuse/DoS control is expected from an
  # edge rate-limiter in front of this app (see docs/guides/DEPLOYMENT.md).
  # Requires the hardened image pinned above (v0.1.2 or newer); do NOT set
  # this on an older image.
  P2A_ALLOW_UNAUTHENTICATED = "1"

  # Confine any filesystem/DB tool access to a dedicated, empty directory
  # rather than the container's home. This directory should exist in the image.
  P2A_DATA_ROOT = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1 = keep a machine warm during the review window (no cold starts, ~$5/mo).
  # Set to 0 afterwards to scale to zero and pay almost nothing.
  min_machines_running = 1

  # Backstop only — this is a ceiling on in-flight requests, not a rate limit:
  # it cannot tell one abusive caller from many reviewers. The real abuse control
  # belongs at the edge (checklist step 5 in docs/guides/DEPLOYMENT.md). What it
  # does buy is a bound on concurrent CPU-bound tool calls, which would otherwise
  # be unbounded on a 1-vCPU machine and can OOM it.
  #
  # Sized with SSE in mind: an /api/llm/chat/stream connection holds a slot for
  # the life of the stream (minutes), so these have to clear the number of
  # reviewers plausibly streaming at once by a wide margin. Requests past
  # hard_limit get a 503.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1gb"
