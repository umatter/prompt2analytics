name: Security audit

on:
  schedule:
    # Weekly, Monday 06:00 UTC: catches advisories published against a lockfile
    # nobody touched.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  # Also on any change to the dependency set, so a Dependabot PR or a hand bump
  # is audited before it merges instead of failing the next Monday run.
  # Path-filtered, so ordinary PRs do not pay for the cargo-audit install.
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # The rkyv, rmcp and zstd exemptions under "Run cargo audit" rest on facts
      # about the dependency graph that a feature change (a Dependabot PR, a hand
      # edit) can make false while the --ignore flags keep the audit green.
      # Test them first; each failure names the exemption that no longer holds.
      # --locked: test the committed Cargo.lock, the graph cargo audit reads.
      - name: Check exemption preconditions
        run: |
          # RUSTSEC-2026-0235 affects rkyv 0.7.0-pre.2 through 0.8.16, so look
          # for any compiled version in that range, not only 0.7.46.
          if ! compiled=$(cargo tree --locked --workspace --all-features --target all \
              -e normal,build --prefix none --format '{p}'); then
            echo "::error::cargo tree failed, so the RUSTSEC-2026-0235 (rkyv) exemption cannot be checked."
            exit 1
          fi
          if grep -E '^rkyv v0\.(7\.|8\.([0-9]|1[0-6])([^0-9]|$))' <<<"$compiled"; then
            echo "::error::The RUSTSEC-2026-0235 exemption no longer holds: rkyv is compiled, not lockfile-only."
            exit 1
          fi
          if ! features=$(cargo tree --locked --workspace --all-features --target all \
              -e features -i rmcp); then
            echo "::error::cargo tree -i rmcp failed, so the RUSTSEC-2026-0189 (rmcp) exemption cannot be checked."
            exit 1
          fi
          if grep -E 'rmcp feature "[^"]*(streamable-http|server-side-http)' <<<"$features"; then
            echo "::error::The RUSTSEC-2026-0189 exemption no longer holds: an rmcp HTTP transport feature is enabled."
            exit 1
          fi
          # RUSTSEC-2026-0398 is in zstd-safe's seekable module, which only its
          # `seekable` feature compiles.
          if ! features=$(cargo tree --locked --workspace --all-features --target all \
              -e features -i zstd-safe); then
            echo "::error::cargo tree -i zstd-safe failed, so the RUSTSEC-2026-0398 (zstd-safe) exemption cannot be checked."
            exit 1
          fi
          if grep -F 'zstd-safe feature "seekable"' <<<"$features"; then
            echo "::error::The RUSTSEC-2026-0398 exemption no longer holds: zstd-safe's seekable feature is enabled."
            exit 1
          fi
          # RUSTSEC-2026-0391 and RUSTSEC-2026-0403 are exempted on how polars
          # 0.52.0 calls zstd 0.13.3. Another caller, or another version of
          # either, needs that argument made again; zstd 0.13.3 gone means the
          # two exemptions (and this check) are to be deleted.
          if ! callers=$(cargo tree --locked --workspace --all-features --target all \
              -e normal,build -i zstd@0.13.3 --depth 1 --prefix none --format '{p}'); then
            echo "::error::cargo tree -i zstd@0.13.3 failed, so the RUSTSEC-2026-0391 and RUSTSEC-2026-0403 (zstd) exemptions cannot be checked; if zstd 0.13.3 is gone, delete them."
            exit 1
          fi
          expected=$'polars-arrow v0.52.0\npolars-parquet v0.52.0\nzstd v0.13.3'
          if [[ "$(LC_ALL=C sort <<<"$callers")" != "$expected" ]]; then
            echo "::error::The RUSTSEC-2026-0391 and RUSTSEC-2026-0403 exemptions no longer hold: zstd 0.13.3 is a dependency of $(grep -v '^zstd ' <<<"$callers" | sed -z 's/\n/, /g; s/, $//')."
            exit 1
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audits Cargo.lock against the RustSec advisory database. This DOES gate:
      # cargo audit exits non-zero on vulnerabilities. (It exits 0 on unmaintained,
      # unsound and yanked crates, which it reports as warnings.)
      #
      # Exemptions live here, as flags, rather than in .cargo/audit.toml:
      # .cargo/ is gitignored, so a config file there never reaches CI and the
      # job would stay red while looking configured. Each entry needs a reason
      # and a condition for re-checking it; delete an entry, and its check in
      # "Check exemption preconditions" if it has one, as soon as it stops being
      # true. A permanently red audit is one nobody reads, so an advisory that
      # does not apply here is exempted with its reason rather than left failing
      # the job. The "Check exemption preconditions" step above tests the rkyv,
      # rmcp and zstd conditions on every run.
      #
      # Cargo.lock lists more than is compiled: an optional dependency named in a
      # weak feature (`dep?/feature`) is locked even when nothing enables it.
      # "Lockfile-only" below means no affected version of the crate appears in
      # `cargo tree --workspace --all-features --target all -e normal,build`.
      #
      #   RUSTSEC-2026-0189  rmcp 0.8.5: DNS rebinding in the Streamable HTTP
      #     server transport, fixed in rmcp 1.4.0 (a breaking upgrade). Not
      #     compiled here: rmcp resolves to base64, default, macros, server,
      #     transport-async-rw and transport-io, so the streamable-http
      #     transport is absent. p2a-mcp's HTTP surface is its own axum server;
      #     DNS-rebinding protection for it belongs there, not in rmcp. Re-check
      #     if rmcp's features change; delete it, and the rmcp check above, when
      #     rmcp >= 1.4.
      #
      #   RUSTSEC-2026-0235  rkyv 0.7.46: lockfile-only. rust_decimal names it in
      #     the weak feature `rkyv?/std`, but nothing enables rust_decimal's
      #     `rkyv` feature. Re-check if rust_decimal's features change.
      #
      #   RUSTSEC-2026-0194, RUSTSEC-2026-0195  quick-xml 0.38.4: compiled into
      #     p2a-core and everything above it through object_store's `cloud`
      #     feature, which polars-io turns on (polars-stream -> file_cache ->
      #     cloud -> http). object_store uses it only to parse remote object-store
      #     responses (S3, Azure, WebDAV listings). p2a configures no remote
      #     store, and p2a-mcp hands polars only local paths from path_jail.
      #     Held by object_store 0.12 under polars 0.52, which is pinned
      #     (calamine no longer holds it; 0.37 uses quick-xml 0.42).
      #     object_store first requires ^0.41 in 0.14.1, and polars 0.53 still uses
      #     object_store 0.13. Revisit when polars moves to object_store >= 0.14.1.
      #
      #   The three zstd entries below are held by polars-arrow and
      #   polars-parquet 0.52, the only users of the zstd crate here (the zstd
      #   check above), which require zstd ^0.13 and so zstd-safe ^7; the fixes
      #   are in zstd 0.14.3 and zstd-safe 8.2.0, and polars 0.52 is pinned.
      #   (zstd-sys's RUSTSEC-2026-0410 was fixed by updating to 2.1.2.) Delete
      #   all three, and the zstd checks above, when polars requires zstd >=
      #   0.14.3.
      #
      #   RUSTSEC-2026-0391  zstd 0.13.3: a stream decoder or encoder made with
      #     `with_context` inherits what an abandoned stream left on that
      #     context. Reached: polars-parquet decompresses the pages of a column
      #     chunk through `read::Decoder::with_context` on one context, so every
      #     zstd Parquet file a user loads or uploads, in hosted mode too, runs
      #     the affected code. Not a disclosure here: polars creates that
      #     context for one column chunk of one read (BasicDecompressor) and
      #     drops it with the read, and p2a-mcp's dictionary check passes a new
      #     one for every page, so what an abandoned page leaves can only reach
      #     a later page of the same column of the same file, bytes its uploader
      #     already has. Keep every context to one file.
      #
      #   RUSTSEC-2026-0403  zstd-safe 7.2.4: `DCtx::decompress_stream` keeps
      #     the output position of a failed call inside a legacy frame, which
      #     extends a `Vec` destination over uninitialized memory. Legacy frames
      #     are compiled in (zstd's default features), but the flaw is not
      #     reached: polars decompresses through `read::Decoder` into
      #     initialized slices, which the advisory lists as unaffected, and
      #     nothing here calls `write::Decoder` or streams into a `Vec`.
      #
      #   RUSTSEC-2026-0398  zstd-safe 7.2.4: `Seekable::decompress`. Not
      #     compiled: the seekable module needs zstd-safe's `seekable` feature,
      #     which nothing enables (checked above).
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0189 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0391 \
            --ignore RUSTSEC-2026-0403 \
            --ignore RUSTSEC-2026-0398
