# Pinning every action to a SHA (see .github/workflows/*.yml) removes the
# supply-chain risk of a mutable tag or branch being repointed, but replaces it
# with staleness: a pinned digest never picks up an upstream security fix on its
# own. This is the other half of that trade — Dependabot opens PRs bumping the
# digests, and the `# <tag>` comment beside each pin is what it rewrites.
#
# Cargo is covered too, but narrowly. `versioning-strategy: lockfile-only` means
# Dependabot only proposes versions the manifests already allow, so the weekly
# PR touches Cargo.lock alone and needs no code change: 1.x minors and patches,
# and patches of 0.x crates. Breaking upgrades (a new major, or a new minor of a
# 0.x crate, which Cargo treats as breaking) are not proposed and stay manual.
# Dependabot labels a 0.x minor as "minor" by its version string, so the
# `ignore` rules name both semver-major and semver-minor for the crates held
# to one release line: ndarray 0.16, polars 0.52 and faer 0.22 (pinned in
# CLAUDE.md) and rand 0.8 with rand_distr 0.4 and rand_chacha 0.3. They stay
# put even if the strategy changes.
#
# Version updates only reach direct dependencies. Most advisories arrive
# transitively (rustls via reqwest, ammonia via surrealdb), so the weekly
# `Security audit` workflow remains the tripwire for those. Turning on
# "Dependabot security updates" in the repository settings lets GitHub open fix
# PRs for them as well; the `cargo-security` group below collects those PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # One PR for all action updates, not one per action. Several of these actions
    # are only correct in matched sets, and ungrouped PRs are individually
    # plausible while jointly broken:
    #   * upload-artifact / download-artifact must move together — desktop-bundle
    #     uploads in `build` and downloads in `release`, and v3 -> v4 was already
    #     a breaking change across that pair.
    #   * configure-pages / upload-pages-artifact / deploy-pages are a coordinated
    #     trio, in the job holding `pages: write` and `id-token: write`.
    # Grouping also means CI validates the whole set at once, which is the only
    # way the pairing above actually gets exercised before merge.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 5
    # Wait a week before proposing a freshly published release; a yanked or
    # compromised release is usually caught within days. Security updates are
    # not delayed by this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      cargo-compatible:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "ndarray"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "polars*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "faer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_distr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
