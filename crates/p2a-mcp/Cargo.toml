[package]
name = "p2a-mcp"
description = "MCP server for prompt2analytics - natural language data analytics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "p2a_mcp"
path = "src/lib.rs"

[[bin]]
name = "p2a-mcp"
path = "src/main.rs"

[dependencies]
# Core analytics engine
p2a-core = { path = "../p2a-core", features = ["full"] }

# Numerics (for ML tools)
ndarray.workspace = true

# MCP Protocol
rmcp.workspace = true
schemars.workspace = true

# Async runtime
tokio.workspace = true
tokio-util = "0.7"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Time
chrono = "0.4"

# Filesystem helpers (used by the path jail and HTTP file listing)
dirs = "5.0"

# HTTP server (optional, for web transport)
axum = { version = "0.8", features = ["ws", "macros"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"], optional = true }

# WebSocket (optional)
tokio-tungstenite = { version = "0.26", optional = true }

# Streaming
tokio-stream = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# UUID for session IDs
uuid = { version = "1.11", features = ["v4"] }

# Database persistence (optional)
# Embedded engines only (engine::local::{Mem, RocksDb}). The default features
# add the remote WebSocket client and its TLS stack (protocol-ws, rustls),
# which nothing here uses and which held webpki-roots 0.26 in the tree.
surrealdb = { version = "2.4", default-features = false, features = ["kv-rocksdb", "kv-mem"], optional = true }

# JWT authentication (optional)
jsonwebtoken = { version = "9.3", optional = true }

# LLM integration (optional)
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
base64.workspace = true

# Parquet page headers, read before a file is decoded. Pinned to the exact
# version polars-parquet 0.52 parses with, and bumped together with polars:
# the check before decoding (tools/handlers/data.rs) mirrors polars' page
# reader, so it must parse page headers with polars' own thrift code. The
# check also names polars' footer types with this crate's, so a polars that
# moves to another version stops compiling rather than drifting apart.
polars-parquet-format = "=0.1.0"
# Decompresses a categorical column's dictionary pages before the file is
# decoded, with polars' own codecs, so each label is counted once over the
# row groups (tools/handlers/data.rs). Pinned with polars like the above, and
# tied to it at compile time: the check holds the footer polars' reader
# returns as this crate's `parquet::metadata::FileMetadata` (polars-io's
# `FileMetadataRef` is an Arc of it), so a polars that reads with another
# polars-parquet stops compiling rather than decompressing with a second
# copy of the codecs.
polars-parquet = { version = "=0.52.0", default-features = false }

[dev-dependencies]
polars.workspace = true
tempfile = "3.10"
# R reference cases (validation/expected/*.json); path only, never published.
p2a-validation = { path = "../p2a-validation" }

[features]
default = []
http = ["axum", "tower", "tower-http", "tokio-stream", "futures", "async-stream"]
websocket = ["http", "tokio-tungstenite"]
auth = ["jsonwebtoken"]
llm = ["async-trait", "reqwest", "futures"]
db = ["surrealdb"]
full = ["http", "websocket", "auth", "llm", "db"]
# Embedded feature for desktop/mobile apps - includes everything needed for standalone operation
embedded = ["http", "llm", "db"]

[lints]
workspace = true
